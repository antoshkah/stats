name: Deploy to GitHub Pages

# publishes the app in src/ (the README's assets/ aren't part of the site)
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # deploy-pages looks up the uploaded artifact through the Actions API
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# two jobs, not one: deploying straight after the upload in the same job can ask for the artifact
# before GitHub lists it ("No artifacts named github-pages were found")
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
